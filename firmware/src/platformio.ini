; ============================================================================
; Smart Home - ESP8266 firmware
;
; All settings live in src/main.cpp: Wi-Fi credentials, backend address and
; telemetry periods. Nothing is injected here, so the same build works from the
; Arduino IDE and from PlatformIO.
;
; Pinout (fixed in firmware, backend only maps channels to logical devices):
;   D1 (GPIO5)  -> Relay 1
;   D2 (GPIO4)  -> Relay 2
;   D3 (GPIO0)  -> Relay 3
;   D4 (GPIO2)  -> Relay 4
;   D5 (GPIO14) -> Relay 5
;   D6 (GPIO12) -> Relay 6
;   D7 (GPIO13) -> DHT22 DATA (VCC -> 3.3V, GND -> GND)
; ============================================================================

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps = 
    adafruit/DHT sensor library @ ^1.4.4
    adafruit/Adafruit Unified Sensor @ ^1.1.9
    links2004/WebSockets @ ^2.4.1