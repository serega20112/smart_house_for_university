; ============================================================================
; Smart Home - ESP8266 firmware
;
; Прошивка ничего не знает про дом: ни имени сети, ни пароля, ни адреса сервера.
; Плата получает их от владельца — со страницы настройки на собственной точке
; доступа или кадром SET_NETWORK — и хранит в памяти чипа (config_store,
; settings). Поэтому одна сборка подходит всем платам, и её можно собрать хоть из
; Arduino IDE, хоть отсюда.
;
; Пины (заданы прошивкой, сервер только решает, какое логическое устройство за
; каким каналом стоит):
;   D1 (GPIO5)  -> Relay 1
;   D2 (GPIO4)  -> Relay 2
;   D3 (GPIO0)  -> Relay 3
;   D4 (GPIO2)  -> Relay 4
;   D5 (GPIO14) -> Relay 5
;   D6 (GPIO12) -> Relay 6
;   D7 (GPIO13) -> DHT22 DATA (VCC -> 3.3V, GND -> GND)
;
; GPIO0 и GPIO2 — бутстрап-пины: по ним чип решает, уходить ли в загрузчик. Реле
; при старте держатся разомкнутыми (INPUT_PULLUP), а в выход пин канала
; переводится уже после загрузчика.
; ============================================================================

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps = 
    adafruit/DHT sensor library @ ^1.4.4
    adafruit/Adafruit Unified Sensor @ ^1.1.9
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^6.21.5
