name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: backend
          POSTGRES_PASSWORD: backend
          POSTGRES_DB: backend
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://backend:backend@localhost:5432/backend
      REDIS_URL: redis://localhost:6379/0
      AUTH_TOKEN_SECRET: ci-only-secret-value-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Apply migrations
        run: alembic -c build/migrations/alembic.ini upgrade head
      - name: Ruff
        run: ruff check src tests scripts
      - name: Import linter
        run: lint-imports
      - name: Mypy
        run: mypy
      - name: Pytest with coverage
        run: pytest --cov=backend --cov-report=term-missing
